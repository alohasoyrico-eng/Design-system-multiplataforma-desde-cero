<!-- @dsCard group="Motion" viewport="700x150" subtitle="Foco visible siempre: anillo rojo 3px · contraste ≥4.5:1 · hit ≥44px" name="Focus & a11y" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--text-primary);background:transparent}</style>
<div style="padding:18px 22px;display:flex;align-items:center;gap:18px">
  <button style="font-family:var(--font-body);min-height:44px;background:var(--surface-card);border:1.5px solid var(--border-default);border-radius:999px;padding:0 22px;font-size:13px;font-weight:600;box-shadow:var(--focus-ring);outline:none;color:var(--text-primary)">:focus-visible</button>
  <div style="min-height:44px;display:flex;align-items:center;background:var(--surface-card);border:1px solid var(--border-default);border-radius:16px;padding:0 16px;box-shadow:var(--focus-ring)"><span style="font-size:13px;color:var(--text-muted)">Input con foco</span></div>
  <div style="font:var(--type-caption);color:var(--text-muted);max-width:240px">--focus-ring: 0 0 0 3px rgba(255,54,23,.28). Nunca outline:none sin reemplazo.</div>
</div>

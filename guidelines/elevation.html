<!-- @dsCard group="Shape" viewport="700x170" subtitle="Sombras suaves y cálidas, 4 niveles + glow de acento" name="Elevation" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--text-primary);background:transparent}</style>
<div style="padding:20px 24px;display:flex;gap:20px;background:var(--surface-canvas)">
  
  <div style="flex:1;height:96px;background:var(--surface-card);border-radius:16px;box-shadow:var(--shadow-rest);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
    <div style="font-size:12px;font-weight:600">rest</div>
    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">--shadow-rest</div>
  </div>
  <div style="flex:1;height:96px;background:var(--surface-card);border-radius:16px;box-shadow:var(--shadow-raised);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
    <div style="font-size:12px;font-weight:600">raised</div>
    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">--shadow-raised</div>
  </div>
  <div style="flex:1;height:96px;background:var(--surface-card);border-radius:16px;box-shadow:var(--shadow-float);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
    <div style="font-size:12px;font-weight:600">float</div>
    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">--shadow-float</div>
  </div>
  <div style="flex:1;height:96px;background:var(--surface-card);border-radius:16px;box-shadow:var(--shadow-overlay);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
    <div style="font-size:12px;font-weight:600">overlay</div>
    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted)">--shadow-overlay</div>
  </div>
  <div style="flex:1;height:96px;background:var(--flow-red-500);border-radius:16px;box-shadow:var(--shadow-accent-glow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
    <div style="font-size:12px;font-weight:600;color:#fff">glow</div>
    <div style="font-family:var(--font-mono);font-size:9px;color:#FFD2CA">accent CTA hover</div>
  </div>
</div>

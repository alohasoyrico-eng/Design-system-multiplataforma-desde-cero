<!-- @dsCard group="Motion" viewport="700x190" subtitle="Resorte para lo que tocas · ease-out para lo que aparece · pasa el cursor" name="Springs" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--text-primary);background:transparent}</style>
<div style="padding:18px 22px;display:flex;gap:16px;align-items:center">
  <button style="font-family:var(--font-body);min-height:44px;background:var(--surface-inverse);color:var(--text-on-inverse);border:none;border-radius:999px;padding:0 24px;font-size:13px;font-weight:600;cursor:pointer;transition:transform var(--dur-fast) var(--ease-spring)"
    onmouseover="this.style.transform='scale(1.04)'" onmouseout="this.style.transform='scale(1)'" onmousedown="this.style.transform='scale(0.96)'" onmouseup="this.style.transform='scale(1.04)'">hover 1.04 · press 0.96</button>
  <div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:16px;padding:14px 18px;cursor:pointer;transition:transform var(--dur-fast) var(--ease-spring),box-shadow var(--dur-fast) var(--ease-out)"
    onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='var(--shadow-float)'" onmouseout="this.style.transform='none';this.style.boxShadow='none'">
    <div style="font-size:13px;font-weight:600">Card lift −3px</div>
    <div style="font-size:11px;color:var(--text-muted)">--ease-spring · --dur-fast 160ms</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">
    <span>spring .34,1.56,.64,1</span><span>out .22,1,.36,1</span><span>100/160/240/400ms</span><span>reduced-motion ✓</span>
  </div>
</div>

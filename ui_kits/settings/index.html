<!-- @dsCard group="Fleet Dashboard" viewport="1100x780" subtitle="Ajustes con tabs, switches y zona peligrosa" name="Settings" -->
<!-- @startingPoint section="Templates" subtitle="Settings: notificaciones, apariencia, cuenta" viewport="1100x780" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Flow · Ajustes</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-canvas)} a{color:var(--text-link);}</style>
</head><body><div id="root"></div>
<script type="text/babel">
function ns(){ for (const k of ['Flow','FlowDS','FlowDesignSystem','DS','DesignSystem']) if (window[k] && window[k].Button) return window[k];
  for (const k of Object.getOwnPropertyNames(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Button && v.Badge) return v; } catch(e){} } return null; }
const NS = ns();
const { Button, Input, Field, Select, Switch, Tabs, Card, Badge, Avatar, Dialog, Toast, ToastStack, Breadcrumb } = NS || {};

function Row({icon,title,description,control,last}){
  return <div style={{display:'flex',alignItems:'center',gap:14,padding:'16px 0',borderBottom:last?'none':'1px solid var(--border-subtle)'}}>
    {icon && <span className="flow-icon" aria-hidden="true" style={{fontSize:22,color:'var(--text-muted)',flex:'none'}}>{icon}</span>}
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontSize:14,fontWeight:600}}>{title}</div>
      {description && <div style={{fontSize:12.5,color:'var(--text-muted)',marginTop:2}}>{description}</div>}
    </div>
    <div style={{flex:'none'}}>{control}</div>
  </div>;
}

function App(){
  const [tab,setTab] = React.useState('notificaciones');
  const [push,setPush] = React.useState(true);
  const [mail,setMail] = React.useState(true);
  const [silent,setSilent] = React.useState(false);
  const [alerts,setAlerts] = React.useState('urgentes');
  const [dark,setDark] = React.useState(false);
  const [lang,setLang] = React.useState('es');
  const [confirm,setConfirm] = React.useState(false);
  const [toast,setToast] = React.useState(null);
  const notify = (m)=>{ setToast(m); setTimeout(()=>setToast(null),3000); };
  const toggleDark = (v)=>{ setDark(v); document.documentElement.setAttribute('data-mode', v?'dark':'light'); };

  return <div style={{maxWidth:860,margin:'0 auto',padding:'36px 24px 64px',color:'var(--text-primary)'}}>
    <Breadcrumb items={[{label:'Flota'},{label:'Ajustes'}]} />
    <h1 style={{font:'var(--type-title-lg)',letterSpacing:'var(--tracking-tight)',margin:'8px 0 20px'}}>Ajustes</h1>
    <Tabs variant="underline" value={tab} onChange={setTab} items={[
      {value:'notificaciones',label:'Notificaciones'},
      {value:'apariencia',label:'Apariencia'},
      {value:'cuenta',label:'Cuenta'},
    ]} style={{marginBottom:24,display:'flex'}} />

    {tab==='notificaciones' && <Card>
      <Row icon="notifications" title="Notificaciones push" description="Viajes, alertas de unidad y mensajes." control={<Switch checked={push} onChange={(v)=>{setPush(v);notify(v?'Push activadas.':'Push desactivadas.');}} />} />
      <Row icon="mail" title="Resumen por correo" description="Reporte diario de la flota a las 7:00." control={<Switch checked={mail} onChange={setMail} />} />
      <Row icon="do_not_disturb_on" title="Modo silencioso" description="Pausa sonidos de 22:00 a 6:00." control={<Switch checked={silent} onChange={setSilent} />} />
      <Row icon="warning" title="Nivel de alertas" description="Qué incidencias generan aviso inmediato." last
        control={<div style={{width:200}}><Select value={alerts} onChange={setAlerts} options={[{value:'todas',label:'Todas'},{value:'urgentes',label:'Solo urgentes'},{value:'ninguna',label:'Ninguna'}]} /></div>} />
    </Card>}

    {tab==='apariencia' && <Card>
      <Row icon="dark_mode" title="Tema oscuro" description="Ideal para turnos de noche." control={<Switch checked={dark} onChange={toggleDark} />} />
      <Row icon="language" title="Idioma" description="Interfaz y notificaciones." last
        control={<div style={{width:200}}><Select value={lang} onChange={setLang} options={[{value:'es',label:'Español'},{value:'en',label:'English'}]} /></div>} />
    </Card>}

    {tab==='cuenta' && <div style={{display:'flex',flexDirection:'column',gap:20}}>
      <Card>
        <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:18}}>
          <Avatar name="Marta Vidal" size="xl" status="online" />
          <div>
            <div style={{fontSize:16,fontWeight:700}}>Marta Vidal</div>
            <div style={{fontSize:12.5,color:'var(--text-muted)'}}>Fleet admin · desde 2024</div>
          </div>
          <Badge tone="accent" style={{marginLeft:'auto'}}>Plan Pro</Badge>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <Field label="Nombre" htmlFor="n"><Input id="n" value="Marta Vidal" onChange={()=>{}} /></Field>
          <Field label="Correo" htmlFor="e"><Input id="e" type="email" value="marta@flota.mx" onChange={()=>{}} icon="mail" /></Field>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',marginTop:18}}>
          <Button variant="primary" onClick={()=>notify('Cambios guardados.')}>Guardar cambios</Button>
        </div>
      </Card>
      <Card style={{borderColor:'var(--status-danger-bg)'}}>
        <Row icon="delete_forever" title="Eliminar cuenta" description="Se borran tus datos y el acceso de tu equipo. Irreversible." last
          control={<Button variant="danger" size="sm" onClick={()=>setConfirm(true)}>Eliminar</Button>} />
      </Card>
    </div>}

    <Dialog open={confirm} onClose={()=>setConfirm(false)} tone="danger" title="¿Eliminar tu cuenta?"
      description="Perderás el acceso a la flota, reportes e historial. Esta acción no se puede deshacer."
      actions={<>
        <Button variant="ghost" onClick={()=>setConfirm(false)}>Cancelar</Button>
        <Button variant="danger" onClick={()=>{setConfirm(false);notify('Solicitud enviada.');}}>Sí, eliminar</Button>
      </>} />
    {toast && <ToastStack><Toast tone="success" message={toast} onDismiss={()=>setToast(null)} /></ToastStack>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(NS ? <App/> : <div style={{padding:20,fontFamily:'monospace',fontSize:12}}>bundle no cargado — recarga en unos segundos</div>);
</script></body></html>

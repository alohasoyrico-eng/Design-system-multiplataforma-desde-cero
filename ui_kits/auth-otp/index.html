<!-- @dsCard group="Fleet Dashboard" viewport="1280x860" subtitle="Ingreso desktop con OTP + mobile con passcode y biometricos" name="Auth OTP" -->
<!-- @startingPoint section="Templates" subtitle="Auth completa: login + OTP (desktop), passcode + biometricos (mobile)" viewport="1280x860" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Flow · Ingreso seguro</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>window.FLOW_ASSET_BASE='../../';</script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../ios-frame.jsx"></script>
<style>body{margin:0;font-family:var(--font-body);background:var(--flow-ink-700)} a{color:var(--text-link);}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = window.Flow || {};
const { Button, Input, Field, OTPInput, PasscodeKeypad, BiometricPrompt, Checkbox, Toast, ToastStack, Badge } = NS;
const Device = window.IOSDevice;

function Resend(){
  const [left,setLeft] = React.useState(42);
  React.useEffect(()=>{ const t=setInterval(()=>setLeft(l=>l>0?l-1:0),1000); return ()=>clearInterval(t); },[]);
  return left>0
    ? <span style={{fontSize:13,color:'var(--text-muted)'}}>Reenviar en 0:{String(left).padStart(2,'0')}</span>
    : <a href="#" onClick={(e)=>{e.preventDefault();setLeft(42);}} style={{fontSize:13,fontWeight:700}}>Reenviar codigo</a>;
}

function DesktopAuth(){
  const [step,setStep] = React.useState('login'); // login → otp → done
  const [email,setEmail] = React.useState('');
  const [pass,setPass] = React.useState('');
  const [code,setCode] = React.useState('');
  const [err,setErr] = React.useState(false);
  const [loading,setLoading] = React.useState(false);
  const submit = (e)=>{ e.preventDefault(); setLoading(true); setTimeout(()=>{setLoading(false);setStep('otp');},700); };
  const verify = (c)=>{ if(c==='000000'){ setErr(true); setTimeout(()=>{setCode('');setErr(false);},500); } else setStep('done'); };
  return <div style={{display:'flex',minHeight:640,background:'var(--surface-canvas)',borderRadius:24,overflow:'hidden',boxShadow:'var(--shadow-overlay)'}}>
    <section aria-hidden="true" style={{flex:1,background:'var(--surface-inverse)',color:'var(--text-on-inverse)',display:'flex',flexDirection:'column',justifyContent:'space-between',padding:44,boxSizing:'border-box',minWidth:340}}>
      <img src="../../assets/flow-logo.png" alt="" style={{height:28,filter:'invert(1)',alignSelf:'flex-start'}} />
      <div>
        <div style={{font:'var(--type-display)',letterSpacing:'var(--tracking-tight)',fontSize:34,lineHeight:1.15}}>Tu flota,<br/><span style={{color:'var(--flow-red-400)'}}>protegida.</span></div>
        <div style={{fontSize:13.5,opacity:.65,marginTop:14,maxWidth:300,lineHeight:1.6}}>Segundo factor en cada ingreso. Sin excepciones.</div>
      </div>
      <div style={{fontSize:12,opacity:.45}}>© 2026 Flow Mobility</div>
    </section>
    <main style={{flex:1.2,display:'flex',alignItems:'center',justifyContent:'center',padding:40}}>
      {step==='login' && <form onSubmit={submit} style={{width:360,display:'flex',flexDirection:'column',gap:18}}>
        <h1 style={{font:'var(--type-title-lg)',letterSpacing:'var(--tracking-tight)',margin:0}}>Entrar</h1>
        <Field label="Correo" htmlFor="e1"><Input id="e1" type="email" icon="mail" placeholder="marta@flota.mx" value={email} onChange={setEmail} /></Field>
        <Field label="Contrasena" htmlFor="p1"><Input id="p1" type="password" icon="lock" placeholder="••••••••" value={pass} onChange={setPass} /></Field>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <Checkbox checked label="Recordarme" onChange={()=>{}} />
          <a href="#" style={{fontSize:13,fontWeight:600}}>Olvidaste tu contrasena?</a>
        </div>
        <Button type="submit" variant="accent" size="lg" fullWidth loading={loading} disabled={!email.includes('@')||!pass}>Continuar</Button>
      </form>}
      {step==='otp' && <div style={{width:380,display:'flex',flexDirection:'column',gap:18,alignItems:'center',textAlign:'center'}}>
        <span style={{width:64,height:64,borderRadius:'50%',background:'var(--surface-accent-subtle)',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>
          <span className="flow-icon" aria-hidden="true" style={{fontSize:30,color:'var(--text-accent)'}}>phonelink_lock</span>
        </span>
        <div>
          <h1 style={{font:'var(--type-title-lg)',letterSpacing:'var(--tracking-tight)',margin:0}}>Verifica tu identidad</h1>
          <p style={{fontSize:13.5,color:'var(--text-secondary)',lineHeight:1.6,margin:'8px 0 0'}}>Enviamos un codigo por SMS al •••• 5678.<br/>Tip: 000000 simula el error.</p>
        </div>
        <OTPInput length={6} value={code} onChange={setCode} onComplete={verify} invalid={err} autoFocus />
        <Resend />
        <Button variant="ghost" size="sm" onClick={()=>{setStep('login');setCode('');}}>Volver</Button>
      </div>}
      {step==='done' && <div style={{display:'flex',flexDirection:'column',gap:14,alignItems:'center',textAlign:'center'}}>
        <span style={{width:84,height:84,borderRadius:'50%',background:'var(--status-success-bg)',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>
          <span className="flow-icon flow-icon--fill" aria-hidden="true" style={{fontSize:44,color:'var(--status-success-text)',animation:'flowScaleIn var(--dur-base) var(--ease-spring)'}}>check_circle</span>
        </span>
        <h1 style={{font:'var(--type-title-lg)',margin:0}}>Bienvenida, Marta</h1>
        <a href="../dashboards/overview.html" style={{textDecoration:'none'}}><Button variant="accent" size="lg">Ir al dashboard</Button></a>
        <Button variant="ghost" size="sm" onClick={()=>{setStep('login');setCode('');}}>Reiniciar demo</Button>
      </div>}
    </main>
  </div>;
}

function MobileAuth(){
  const [mode,setMode] = React.useState('bio'); // bio | pin | done
  const [pin,setPin] = React.useState('');
  const [pinErr,setPinErr] = React.useState(false);
  const [bioState,setBioState] = React.useState('idle');
  return <Device title="" dark>
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:'var(--flow-ink-900)',padding:'18px 22px 28px',boxSizing:'border-box'}}>
      <img src="../../assets/flow-logo.png" alt="Flow" style={{height:22,alignSelf:'center',marginTop:12,filter:'invert(1)'}} />
      {mode==='bio' && <div style={{margin:'auto 0',display:'flex',flexDirection:'column',alignItems:'center',gap:16}}>
        <div style={{color:'#F4F3F1',fontSize:16,fontWeight:600}}>Hola, Diego</div>
        <div style={{cursor:'pointer'}} onClick={()=>{ setBioState('scanning'); setTimeout(()=>{setBioState('success'); setTimeout(()=>setMode('done'),700);},1100); }}>
          <BiometricPrompt method="face" state={bioState} title="Face ID" description={bioState==='success'?'Bienvenido.':'Toca para verificar.'} onFallback={()=>setMode('pin')} />
        </div>
      </div>}
      {mode==='pin' && <div data-mode="dark" style={{margin:'auto 0',display:'flex',flexDirection:'column',alignItems:'center',gap:22}}>
        <div style={{color:'#F4F3F1',fontSize:15,fontWeight:600}}>Ingresa tu passcode</div>
        <PasscodeKeypad value={pin} invalid={pinErr} biometricIcon="ar_on_you" onBiometric={()=>{setMode('bio');setPin('');}}
          onChange={(v)=>{setPinErr(false);setPin(v);}}
          onComplete={(v)=>{ if(v==='000000'){ setPinErr(true); setTimeout(()=>{setPin('');setPinErr(false);},500); } else setMode('done'); }} />
        <span style={{fontSize:11.5,color:'#7C7A76'}}>Tip: 000000 simula el error</span>
      </div>}
      {mode==='done' && <div style={{margin:'auto 0',display:'flex',flexDirection:'column',alignItems:'center',gap:14,textAlign:'center'}}>
        <span style={{width:84,height:84,borderRadius:'50%',background:'rgba(18,183,106,.16)',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>
          <span className="flow-icon flow-icon--fill" aria-hidden="true" style={{fontSize:44,color:'#3BD68B',animation:'flowScaleIn var(--dur-base) var(--ease-spring)'}}>check_circle</span>
        </span>
        <div style={{color:'#F4F3F1',fontSize:18,fontWeight:700}}>Sesion iniciada</div>
        <Button variant="accent" onClick={()=>{setMode('bio');setBioState('idle');setPin('');}}>Reiniciar demo</Button>
      </div>}
    </div>
  </Device>;
}

function App(){
  return <div style={{display:'flex',gap:44,alignItems:'flex-start',justifyContent:'center',padding:'36px 24px',flexWrap:'wrap'}}>
    <div style={{flex:'1 1 640px',maxWidth:820}}>
      <div style={{color:'#fff',fontSize:13,fontWeight:700,margin:'0 0 12px 6px'}}>Desktop · login + OTP</div>
      <DesktopAuth />
    </div>
    <div>
      <div style={{color:'#fff',fontSize:13,fontWeight:700,margin:'0 0 12px 6px'}}>Mobile · biometrico + passcode</div>
      <MobileAuth />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(window.IOSDevice && NS.Button ? <App/> : <div style={{color:'#fff',fontFamily:'monospace',fontSize:12,padding:20}}>cargando…</div>);
</script></body></html>

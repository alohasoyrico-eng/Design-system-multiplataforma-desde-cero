name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (typecheck · tests · builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:catalog
      - run: git fetch --depth=1 origin canonical
      - run: npm run check:inventory
      - run: npm run test
      - run: npm run build
      - run: npm run build:lib

  flutter:
    name: Flutter (analyze · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze library + example
        working-directory: flutter
        run: flutter analyze
      - name: Library tests
        working-directory: flutter
        run: flutter test
      - name: Example tests
        working-directory: flutter/example
        run: flutter test

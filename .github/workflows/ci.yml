name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build tokens (single source of truth → all platforms)
        run: npm run tokens:build
      - name: Lint (ESLint + a11y)
        run: npm run lint
      - name: Lint CSS (Stylelint — no raw hex / z-index / duration)
        run: npm run lint:css
      - name: Audit hardcoded values (no ref reach-through, no magic values)
        run: npm run audit:hardcoded
      - name: Typecheck
        run: npm run typecheck
      - name: Test (contrast, parity, a11y)
        run: npm run test
      - name: Format check
        run: npm run format:check

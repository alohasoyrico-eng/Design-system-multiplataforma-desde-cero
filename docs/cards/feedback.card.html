<!-- @dsCard group="Components" viewport="700x480" subtitle="Toast, Tooltip, Progress, Spinner, Dialog (abre el demo)" name="Feedback" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:transparent}</style>
</head><body><div id="root"></div>
<script type="text/babel">
function ns(){ for (const k of ['Flow','FlowDS','FlowDesignSystem','DS','DesignSystem']) if (window[k] && window[k].Toast) return window[k];
  for (const k of Object.getOwnPropertyNames(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Toast && v.Dialog) return v; } catch(e){} } return null; }
const NS = ns(); const { Toast, Tooltip, Progress, Spinner, Dialog, Button, IconButton } = NS || {};
function Demo(){
  const [open,setOpen] = React.useState(false);
  return <div style={{display:'flex',flexDirection:'column',gap:18,padding:20}}>
    <div style={{display:'flex',flexDirection:'column',gap:10,alignItems:'flex-start'}}>
      <Toast tone="success" message="Unidad asignada a Ana Sosa." actionLabel="Deshacer" onDismiss={()=>{}} />
      <Toast tone="danger" message="No pudimos asignar la unidad. Reintenta o elige otra." onDismiss={()=>{}} />
    </div>
    <div style={{display:'flex',gap:24,alignItems:'center'}}>
      <Tooltip content="Notificaciones"><IconButton icon="notifications" ariaLabel="Notificaciones" variant="tonal" badge /></Tooltip>
      <Tooltip content="Centro de ayuda" position="bottom"><IconButton icon="help" ariaLabel="Ayuda" variant="tonal" /></Tooltip>
      <Spinner />
      <Spinner size={34} color="var(--text-muted)" />
      <Button variant="secondary" onClick={()=>setOpen(true)}>Abrir dialog</Button>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18,maxWidth:560}}>
      <Progress label="Documentos verificados" value={3} max={4} showValue />
      <Progress label="Meta semanal" tone="success" value={82} showValue />
    </div>
    <Dialog open={open} onClose={()=>setOpen(false)} tone="danger" title="¿Eliminar unidad?"
      description="JMX-214-B se desvinculará de su conductor. Esta acción no se puede deshacer."
      actions={<>
        <Button variant="ghost" onClick={()=>setOpen(false)}>Cancelar</Button>
        <Button variant="danger" onClick={()=>setOpen(false)}>Eliminar</Button>
      </>} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(NS ? <Demo/> : <div style={{padding:20,fontFamily:'monospace',fontSize:12}}>bundle no cargado</div>);
</script></body></html>

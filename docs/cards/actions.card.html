<!-- @dsCard group="Components" viewport="700x340" subtitle="Button (5 variantes × 3 tamaños) · IconButton" name="Actions" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:transparent}</style>
</head><body><div id="root"></div>
<script type="text/babel">
function ns(){ for (const k of ['Flow','FlowDS','FlowDesignSystem','DS','DesignSystem']) if (window[k] && window[k].Button) return window[k];
  for (const k of Object.getOwnPropertyNames(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Button && v.IconButton) return v; } catch(e){} } return null; }
const NS = ns(); const { Button, IconButton } = NS || {};
function Demo(){
  return <div style={{display:'flex',flexDirection:'column',gap:16,padding:20}}>
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
      <Button variant="primary">Primary</Button>
      <Button variant="accent" icon="bolt">Accent</Button>
      <Button variant="secondary">Secondary</Button>
      <Button variant="ghost">Ghost</Button>
      <Button variant="danger">Danger</Button>
    </div>
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
      <Button size="sm" variant="secondary" icon="add">Small</Button>
      <Button size="md" variant="secondary" icon="add">Medium</Button>
      <Button size="lg" variant="secondary" icon="add">Large</Button>
      <Button variant="primary" loading>Guardando…</Button>
      <Button variant="primary" disabled>Disabled</Button>
      <Button variant="secondary" iconTrailing="arrow_forward">Continuar</Button>
    </div>
    <div style={{display:'flex',gap:10,alignItems:'center'}}>
      <IconButton icon="notifications" ariaLabel="Notificaciones" badge />
      <IconButton icon="favorite" ariaLabel="Favorito" variant="tonal" />
      <IconButton icon="favorite" ariaLabel="Favorito activo" variant="tonal" selected />
      <IconButton icon="add" ariaLabel="Agregar" variant="primary" />
      <IconButton icon="navigation" ariaLabel="Navegar" variant="accent" />
      <IconButton icon="delete" ariaLabel="Eliminar" disabled />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(NS ? <Demo/> : <div style={{padding:20,fontFamily:'monospace',fontSize:12}}>bundle no cargado</div>);
</script></body></html>

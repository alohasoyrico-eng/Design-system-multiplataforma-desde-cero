<!-- @dsCard group="Components" viewport="700x620" subtitle="PaymentCard, TransactionRow, OTPInput, SegmentedControl, BiometricPrompt" name="Fintech mobile" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>window.FLOW_ASSET_BASE='../../';</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:transparent}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.Flow;
const { PaymentCard, TransactionRow, OTPInput, SegmentedControl, BiometricPrompt, Card } = NS || {};
function Demo(){
  const [code,setCode] = React.useState('482');
  const [seg,setSeg] = React.useState('todas');
  const [bio,setBio] = React.useState('idle');
  return <div style={{display:'flex',flexDirection:'column',gap:18,padding:20}}>
    <div style={{display:'flex',gap:14,flexWrap:'wrap'}}>
      <PaymentCard holder="Diego Vera" last4="4821" variant="ink" label="Flota" expires="12/28" width={270} onClick={()=>{}} />
      <PaymentCard holder="Diego Vera" last4="0937" variant="accent" label="Personal" expires="03/27" width={270} frozen />
    </div>
    <div style={{maxWidth:420}}>
      <SegmentedControl value={seg} onChange={setSeg} items={[{value:'todas',label:'Todas'},{value:'gas',label:'Gasolina',icon:'local_gas_station'},{value:'ev',label:'Electrico',icon:'bolt'}]} />
    </div>
    <Card padding={10} style={{maxWidth:460}}>
      <TransactionRow category="fuel" title="Pemex Reforma" subtitle="Hoy 14:32 · Combustible" amount={-820.50} onClick={()=>{}} />
      <TransactionRow category="charge" title="Electrolinera Polanco" subtitle="Hoy 09:10 · Carga EV" amount={-214.00} onClick={()=>{}} />
      <TransactionRow category="income" title="Deposito semanal" subtitle="Ayer · Transferencia" amount={3720.00} />
      <TransactionRow category="toll" title="Caseta Tepotzotlan" subtitle="Ayer 07:44 · Peaje" amount={-118.00} pending />
    </Card>
    <div style={{display:'flex',gap:22,alignItems:'flex-start',flexWrap:'wrap'}}>
      <div>
        <div style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',marginBottom:8}}>OTP · escribe para probar</div>
        <OTPInput length={6} value={code} onChange={setCode} />
      </div>
      <div style={{cursor:'pointer'}} onClick={()=>setBio(bio==='idle'?'scanning':bio==='scanning'?'success':'idle')}>
        <BiometricPrompt method="face" state={bio} onFallback={()=>{}} />
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(NS ? <Demo/> : <div style={{padding:20,fontFamily:'monospace',fontSize:12}}>bundle no cargado</div>);
</script></body></html>

<!-- @dsCard group="Components" viewport="700x340" subtitle="Tabs (pill + underline), Stepper, Breadcrumb" name="Navigation" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:transparent}</style>
</head><body><div id="root"></div>
<script type="text/babel">
function ns(){ for (const k of ['Flow','FlowDS','FlowDesignSystem','DS','DesignSystem']) if (window[k] && window[k].Tabs) return window[k];
  for (const k of Object.getOwnPropertyNames(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Tabs && v.Stepper) return v; } catch(e){} } return null; }
const NS = ns(); const { Tabs, Stepper, Breadcrumb } = NS || {};
function Demo(){
  const [t1,setT1] = React.useState('ruta');
  const [t2,setT2] = React.useState('general');
  const [step,setStep] = React.useState(1);
  return <div style={{display:'flex',flexDirection:'column',gap:22,padding:20}}>
    <Breadcrumb items={[{label:'Flota'},{label:'Unidades'},{label:'JMX-214-B'}]} />
    <Tabs value={t1} onChange={setT1} items={[
      {value:'todas',label:'Todas',count:128},
      {value:'ruta',label:'En ruta',icon:'navigation',count:96},
      {value:'taller',label:'Taller',count:9},
    ]} />
    <Tabs variant="underline" value={t2} onChange={setT2} items={[
      {value:'general',label:'General'},
      {value:'documentos',label:'Documentos',count:4},
      {value:'historial',label:'Historial'},
    ]} />
    <div style={{cursor:'pointer'}} onClick={()=>setStep((step+1)%4)}>
      <Stepper current={step} steps={[{label:'Unidad',description:'Datos del vehículo'},{label:'Conductor',description:'Asignación'},{label:'Confirmación',description:'Revisa y envía'}]} />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(NS ? <Demo/> : <div style={{padding:20,fontFamily:'monospace',fontSize:12}}>bundle no cargado</div>);
</script></body></html>

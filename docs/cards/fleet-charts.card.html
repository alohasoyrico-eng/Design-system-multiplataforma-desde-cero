<!-- @dsCard group="Components" viewport="900x760" subtitle="Treemap, Pareto, Scatter, SmallMultiples, Bullet y FlowChart — flotas grandes/multientidad" name="Data viz para flotas grandes" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:transparent}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.Flow;
const { Treemap, ParetoChart, ScatterPlot, SmallMultiples, BulletChart, FlowChart, Card } = NS || {};
function Demo(){
  const units = [
    {id:'u1',plate:'JMX-214',km:8200,costoKm:2.1},{id:'u2',plate:'KTR-882',km:3100,costoKm:3.4},
    {id:'u3',plate:'MVD-101',km:9400,costoKm:1.9},{id:'u4',plate:'PLQ-472',km:2200,costoKm:2.6},
    {id:'u5',plate:'QRS-330',km:6100,costoKm:2.3},{id:'u6',plate:'TWN-559',km:4800,costoKm:3.1},
    {id:'u7',plate:'XCV-100',km:7300,costoKm:1.7},{id:'u8',plate:'BNM-220',km:1900,costoKm:4.2},
  ];
  const regions = [
    {id:'r1',label:'CDMX Norte',values:[42,48,45,51,49,55,58]},
    {id:'r2',label:'CDMX Sur',values:[38,40,41,39,44,46,47]},
    {id:'r3',label:'Guadalajara',values:[22,24,23,26,25,27,29]},
    {id:'r4',label:'Monterrey',values:[30,29,31,30,55,60,62]},
  ];
  return <div style={{display:'flex',flexDirection:'column',gap:22,padding:20}}>
    <Card>
      <div style={{font:'var(--type-title-sm)',marginBottom:4}}>Treemap — gasto por region con drill-down (click)</div>
      <Treemap format={(v)=>'$'+v+'k'} nodes={[
        {id:'cdmx',label:'CDMX',value:812,deviation:0.14,children:[{id:'norte',label:'Norte',value:420,deviation:0.22},{id:'sur',label:'Sur',value:392,deviation:0.05}]},
        {id:'gdl',label:'Guadalajara',value:340,deviation:-0.08},
        {id:'mty',label:'Monterrey',value:298,deviation:0.31},
        {id:'pue',label:'Puebla',value:120,deviation:-0.12},
      ]} />
    </Card>
    <Card>
      <div style={{font:'var(--type-title-sm)',marginBottom:4}}>Pareto — el 20% de unidades que genera el 80% del gasto</div>
      <ParetoChart format={(v)=>'$'+v+'k'} data={[{label:'JMX-214',value:42},{label:'KTR-882',value:38},{label:'MVD-101',value:12},{label:'PLQ-472',value:9},{label:'QRS-330',value:7},{label:'TWN-559',value:5},{label:'XCV-100',value:3},{label:'BNM-220',value:2}]} />
    </Card>
    <Card>
      <div style={{font:'var(--type-title-sm)',marginBottom:4}}>Scatter — eficiencia (costo/km vs km recorridos)</div>
      <ScatterPlot points={units.map(u=>({id:u.id,x:u.km,y:u.costoKm,label:u.plate}))} xLabel="Km recorridos" yLabel="Costo/km" xThreshold={3000} yThreshold={3} width={600} height={280} />
    </Card>
    <Card>
      <div style={{font:'var(--type-title-sm)',marginBottom:4}}>Small Multiples — misma escala, outliers en accent</div>
      <SmallMultiples items={regions} isOutlier={(it)=>Math.max(...it.values) > 55} format={(v)=>v+' viajes'} />
    </Card>
    <Card>
      <div style={{font:'var(--type-title-sm)',marginBottom:4}}>FlowChart · heatmap — demanda por dia y hora</div>
      <FlowChart type="heatmap" height={280} format={(v)=>v+' viajes'}
        matrix={{rows:['Lun','Mar','Mie','Jue','Vie','Sab'], cols:['6h','9h','12h','15h','18h','21h'],
          values:[[12,28,22,30,45,20],[10,25,20,29,42,18],[14,30,25,32,48,22],[15,31,27,33,50,25],[18,35,30,38,60,30],[8,15,20,22,55,40]]
            .flatMap((row,r)=>row.map((v,c)=>[c,r,v]))}}
        ariaLabel="El pico de viajes es viernes a las 18h" />
    </Card>
    <Card>
      <div style={{font:'var(--type-title-sm)',marginBottom:4}}>Bullet — real vs meta vs periodo anterior por entidad</div>
      <BulletChart format={(v)=>'$'+v+'k'} rows={[
        {label:'CDMX',value:82,target:75,prev:70,max:100},
        {label:'Guadalajara',value:34,target:40,prev:38,max:100},
        {label:'Monterrey',value:29,target:25,prev:22,max:100},
      ]} />
    </Card>
    <Card>
      <div style={{font:'var(--type-title-sm)',marginBottom:4}}>Stacked 100% — mix de gasto por producto entre entidades</div>
      <FlowChart type="stacked100" palette="categorical" height={240}
        labels={['CDMX','Guadalajara','Monterrey']}
        series={[
          {label:'Combustible',values:[52,70,40]},
          {label:'Peaje',values:[18,10,12]},
          {label:'Mantenimiento',values:[20,15,18]},
          {label:'Electromovilidad',values:[10,5,30]},
        ]}
        ariaLabel="Monterrey concentra la electromovilidad de la flota" />
    </Card>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(NS ? <Demo/> : <div style={{padding:20,fontFamily:'monospace',fontSize:12}}>bundle no cargado</div>);
</script></body></html>

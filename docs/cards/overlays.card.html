<!-- @dsCard group="Components" viewport="700x460" subtitle="Menu, Drawer, Accordion, Pagination" name="Overlays & Nav 2" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:transparent}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.Flow;
const { Menu, Drawer, Accordion, Pagination, Button, IconButton, Badge, Progress } = NS || {};
function Demo(){
  const [open,setOpen] = React.useState(false);
  const [page,setPage] = React.useState(4);
  return <div style={{display:'flex',flexDirection:'column',gap:20,padding:20}}>
    <div style={{display:'flex',gap:14,alignItems:'center'}}>
      <Menu trigger={<Button variant="secondary" iconTrailing="expand_more">Acciones</Button>}
        items={[
          {label:'Editar', icon:'edit'},
          {label:'Duplicar', icon:'content_copy'},
          {label:'Exportar CSV', icon:'download'},
          'divider',
          {label:'Eliminar', icon:'delete', danger:true},
        ]} />
      <Menu align="right" trigger={<IconButton icon="more_vert" ariaLabel="Más acciones" variant="tonal" />}
        items={[{label:'Ver detalle', icon:'visibility'},{label:'Archivar', icon:'archive'}]} />
      <Button variant="primary" onClick={()=>setOpen(true)}>Abrir drawer</Button>
      <Pagination page={page} pages={12} onChange={setPage} style={{marginLeft:'auto'}} />
    </div>
    <Accordion defaultOpen="docs" items={[
      {id:'docs', title:'Documentos', icon:'description', meta:'3 de 4', content:<Progress label="Verificación" value={3} max={4} showValue />},
      {id:'hist', title:'Historial de viajes', icon:'history', content:'128 viajes este mes. Último: hoy 14:32, Roma Norte → Polanco.'},
      {id:'pagos', title:'Métodos de pago', icon:'payments', content:'Depósito semanal a cuenta terminación 4821.'},
    ]} />
    <Drawer open={open} onClose={()=>setOpen(false)} title="Ana Sosa"
      footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cerrar</Button><Button variant="primary">Guardar</Button></>}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Badge tone="success" live>En ruta</Badge>
        <p style={{fontSize:13.5,color:'var(--text-secondary)',lineHeight:1.6,margin:0}}>Conductora desde 2024 · 1,240 viajes · rating 4.96. Unidad asignada JMX-214-B.</p>
        <Progress label="Documentos" value={3} max={4} showValue />
      </div>
    </Drawer>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(NS ? <Demo/> : <div style={{padding:20,fontFamily:'monospace',fontSize:12}}>bundle no cargado</div>);
</script></body></html>

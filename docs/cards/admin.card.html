<!-- @dsCard group="Components" viewport="700x640" subtitle="MapCanvas (OSM), StatTile, Donut, RoleMatrix" name="Maps & Admin" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>window.FLOW_ASSET_BASE='../../';</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:transparent}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.Flow;
const { MapCanvas, StatTile, Donut, RoleMatrix } = NS || {};
function Demo(){
  const [sel,setSel] = React.useState('s2');
  const [vals,setVals] = React.useState({ ver:{admin:true,ops:true,driver:true}, editar:{admin:true,ops:true}, eliminar:{admin:true}, invitar:{admin:true,ops:true} });
  return <div style={{display:'flex',flexDirection:'column',gap:16,padding:20}}>
    <div style={{display:'grid',gridTemplateColumns:'1.3fr 1fr',gap:16}}>
      <MapCanvas center={{lat:19.4326,lng:-99.1500}} zoom={13} height={230} selectedId={sel} onPinClick={(p)=>setSel(p.id)}
        pins={[
          {id:'s1',lat:19.4426,lng:-99.1680,label:'$23.4',icon:'local_gas_station'},
          {id:'s2',lat:19.4290,lng:-99.1420,label:'$22.9',icon:'local_gas_station'},
          {id:'s3',lat:19.4190,lng:-99.1610,label:'$4.2/kWh',icon:'bolt'},
        ]}
        route={[{lat:19.4326,lng:-99.1500},{lat:19.4310,lng:-99.1460},{lat:19.4290,lng:-99.1420}]} />
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <StatTile label="Gasto mes" value="$248k" delta="−4%" trend="up" icon="payments" />
          <StatTile label="$/km" value="2.14" delta="+3%" trend="down" icon="route" />
        </div>
        <Donut size={120} thickness={15} centerValue="$248k" centerLabel="Total" segments={[
          {label:'Combustible',value:182},{label:'Peaje',value:41},{label:'Mantenimiento',value:25}]} />
      </div>
    </div>
    <RoleMatrix
      roles={[{id:'admin',label:'Admin',locked:true},{id:'ops',label:'Operaciones'},{id:'driver',label:'Driver'}]}
      permissions={[
        {id:'ver',label:'Ver unidades y viajes',group:'Flota'},
        {id:'editar',label:'Editar unidades',group:'Flota'},
        {id:'eliminar',label:'Eliminar unidades',group:'Flota'},
        {id:'invitar',label:'Invitar miembros',group:'Equipo'},
      ]}
      values={vals} onChange={setVals} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(NS ? <Demo/> : <div style={{padding:20,fontFamily:'monospace',fontSize:12}}>bundle no cargado</div>);
</script></body></html>

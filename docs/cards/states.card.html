<!-- @dsCard group="Components" viewport="900x420" subtitle="StatusView (conexion a servicios: success, error, pending, loading, offline) y CircularProgress" name="States & Connections" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Flow · States & Connections</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>window.FLOW_ASSET_BASE='../../';</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-canvas);padding:24px;box-sizing:border-box}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.Flow || {};
const { StatusView, CircularProgress, Button, Card } = NS;

function Demo(){
  const states = ['loading','success','error','pending','offline'];
  const copy = {
    loading: {title:'Conectando con el servidor…', description:'Sincronizando tus viajes y ganancias.'},
    success: {title:'Cuenta verificada', description:'Ya puedes empezar a recibir viajes.'},
    error: {title:'No pudimos conectar con el servidor', description:'Revisa tu conexión e intenta de nuevo.'},
    pending: {title:'Verificando tu pago', description:'Esto puede tardar unos segundos.'},
    offline: {title:'Sin conexión', description:'Reconéctate para seguir usando Flow.'},
  };
  return <div style={{display:'flex',flexDirection:'column',gap:28}}>
    <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
      {states.map(s=><Card key={s} style={{width:180}}>
        <StatusView status={s} title={copy[s].title} description={copy[s].description}
          primaryAction={s==='error' && <Button variant="accent" size="sm" fullWidth>Reintentar</Button>}
          style={{padding:'20px 14px'}} />
      </Card>)}
    </div>
    <div style={{display:'flex',gap:28,alignItems:'center'}}>
      <CircularProgress value={72} showValue label="Batería" tone="success" />
      <CircularProgress value={38} showValue label="Cuota semanal" tone="accent" />
      <CircularProgress value={6} max={8} showValue label="Documentos" tone="warning" size={64} />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(NS.StatusView ? <Demo/> : <div style={{padding:20,fontFamily:'monospace',fontSize:12}}>bundle no cargado</div>);
</script></body></html>

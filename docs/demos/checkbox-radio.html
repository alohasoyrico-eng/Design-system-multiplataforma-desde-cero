<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>window.FLOW_ASSET_BASE='../../';</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:transparent;padding:20px;box-sizing:border-box}h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:32px 0 12px}h3:first-child{margin-top:0}</style></head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = window.Flow || {};
const only = new URLSearchParams(location.search).get('item');
function Sections({list, style}){
  const vis = list.filter(s=>!only || s.id===only);
  return <div style={style||{display:'flex',flexDirection:'column',maxWidth:860}}>{vis.map(s=><React.Fragment key={s.id}>{!only && s.title ? <h3>{s.title}</h3> : null}<s.C/></React.Fragment>)}</div>;
}
const { Checkbox, Radio } = NS;
const LIST = [
  {id:'checkbox', title:'Checkbox', C:function(){ const [c,setC]=React.useState(true);
    return <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <Checkbox checked={c} onChange={setC} label="Recordarme" />
      <Checkbox indeterminate label="Seleccionar todo (3 de 12)" />
    </div>; }},
  {id:'radio', title:'Radio', C:function(){ const [plan,setPlan]=React.useState('pro');
    return <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <Radio name="p" value="basic" checked={plan==='basic'} onChange={setPlan} label="Basico" />
      <Radio name="p" value="pro" checked={plan==='pro'} onChange={setPlan} label="Pro" description="Flotas de 10+ unidades" />
    </div>; }},
];
function Demo(){ return <Sections list={LIST} style={{display:'flex',flexDirection:'column',maxWidth:420}} />; }
ReactDOM.createRoot(document.getElementById('root')).render(NS.Checkbox ? <Demo/> : <div style={{fontFamily:'monospace',fontSize:12}}>cargando…</div>);
</script></body></html>

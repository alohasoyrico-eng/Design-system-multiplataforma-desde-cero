<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>window.FLOW_ASSET_BASE='../../';</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:transparent;padding:20px;box-sizing:border-box}h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:32px 0 12px}h3:first-child{margin-top:0}</style></head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = window.Flow || {};
const only = new URLSearchParams(location.search).get('item');
function Sections({list, style}){
  const vis = list.filter(s=>!only || s.id===only);
  return <div style={style||{display:'flex',flexDirection:'column',maxWidth:860}}>{vis.map(s=><React.Fragment key={s.id}>{!only && s.title ? <h3>{s.title}</h3> : null}<s.C/></React.Fragment>)}</div>;
}
const { Spinner, Progress } = NS;
const LIST = [
  {id:'spinner', title:'Spinner', C:()=><div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}><Spinner /><Spinner size={36} color="var(--text-muted)" /></div>},
  {id:'progress', title:'Progress', C:function(){ const [v,setV]=React.useState(3);
    return <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <Progress label="Documentos verificados" value={v} max={4} showValue />
      <Progress label="Meta semanal" tone="success" value={82} showValue />
      <button onClick={()=>setV(x=>x>=4?1:x+1)} style={{alignSelf:'flex-start',font:'var(--type-body-strong)',border:'1px solid var(--border-default)',background:'var(--surface-card)',borderRadius:'var(--radius-pill)',padding:'6px 14px',cursor:'pointer'}}>Avanzar (mira la barra animar)</button>
    </div>; }},
];
function Demo(){ return <Sections list={LIST} style={{display:'flex',flexDirection:'column',maxWidth:420}} />; }
ReactDOM.createRoot(document.getElementById('root')).render(NS.Spinner ? <Demo/> : <div style={{fontFamily:'monospace',fontSize:12}}>cargando…</div>);
</script></body></html>

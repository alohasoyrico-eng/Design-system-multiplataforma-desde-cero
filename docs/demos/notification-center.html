<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>window.FLOW_ASSET_BASE='../../';</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:transparent;padding:20px;box-sizing:border-box}h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:32px 0 12px}h3:first-child{margin-top:0}</style></head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = window.Flow || {};
const only = new URLSearchParams(location.search).get('item');
function Sections({list, style}){
  const vis = list.filter(s=>!only || s.id===only);
  return <div style={style||{display:'flex',flexDirection:'column',maxWidth:860}}>{vis.map(s=><React.Fragment key={s.id}>{!only && s.title ? <h3>{s.title}</h3> : null}<s.C/></React.Fragment>)}</div>;
}
const { NotificationCenter } = NS;
const ITEMS = [
  {id:1,tone:'danger',title:'Verificación rechazada',desc:'JMX-214-B no pasó emisiones. Reagendar antes del 20 jul.',time:'hace 12 min',read:false},
  {id:2,tone:'warning',title:'Póliza por vencer',desc:'Flota CDMX: la póliza vence en 45 días.',time:'hace 2 h',read:false},
  {id:3,tone:'success',title:'Pago aplicado',desc:'Recarga de $12,000 a la cuenta principal.',time:'ayer',read:true},
  {id:4,tone:'info',title:'Nuevo conductor verificado',desc:'Elena Ruz completó su verificación.',time:'ayer',read:true},
];
const LIST = [
  {id:'notification-center', title:'NotificationCenter (click en la campana)', C:()=><div style={{display:'flex',justifyContent:'flex-end',minHeight:420,paddingTop:4}}>
    <NotificationCenter items={ITEMS} onMarkAllRead={()=>{}} onItemClick={()=>{}} />
  </div>},
];
function Demo(){ return <Sections list={LIST} style={{display:'flex',flexDirection:'column',maxWidth:560}} />; }
ReactDOM.createRoot(document.getElementById('root')).render(NS.NotificationCenter ? <Demo/> : <div style={{fontFamily:'monospace',fontSize:12}}>cargando…</div>);
</script></body></html>

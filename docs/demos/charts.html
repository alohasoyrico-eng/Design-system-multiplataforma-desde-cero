<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>window.FLOW_ASSET_BASE='../../';</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:transparent;padding:20px;box-sizing:border-box}h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:32px 0 12px}h3:first-child{margin-top:0}</style></head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = window.Flow || {};
const only = new URLSearchParams(location.search).get('item');
function Sections({list, style}){
  const vis = list.filter(s=>!only || s.id===only);
  return <div style={style||{display:'flex',flexDirection:'column',maxWidth:860}}>{vis.map(s=><React.Fragment key={s.id}>{!only && s.title ? <h3>{s.title}</h3> : null}<s.C/></React.Fragment>)}</div>;
}
const { Card, Sparkline, Bars } = NS;
const LIST = [
  {id:'sparkline', title:'Sparkline', C:()=><Card padding={16} style={{maxWidth:280}}><div style={{fontSize:11,fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--text-muted)'}}>Viajes · 7 dias</div><div style={{fontFamily:'var(--font-mono)',fontSize:24,fontWeight:600,margin:'4px 0 8px'}}>412</div><Sparkline values={[42,58,51,64,72,66,89]} width={200} height={48} /></Card>},
  {id:'bars', title:'Bars', C:()=><Card padding={16} style={{maxWidth:380}}><div style={{fontSize:11,fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:8}}>Ganancias por dia</div><Bars height={120} format={(v)=>'$'+v} data={[{label:'Lun',value:820},{label:'Mar',value:1140},{label:'Mie',value:960},{label:'Jue',value:1310},{label:'Vie',value:1482},{label:'Sab',value:1275},{label:'Dom',value:640}]} /></Card>},
];
function Demo(){ return <Sections list={LIST} style={{display:'flex',flexDirection:'column',maxWidth:640}} />; }
ReactDOM.createRoot(document.getElementById('root')).render(NS.Card ? <Demo/> : <div style={{fontFamily:'monospace',fontSize:12}}>cargando…</div>);
</script></body></html>
